<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>先冷靜一下｜衝動購物冷卻＆回本所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fbf9f5;
      --paper-2: #ede8de;
      --ink: #232220;
      --muted: #78746c;
      --accent: #c86d3b;
      --accent-soft: rgba(200, 109, 59, 0.12);
      --ok: #3b7a57;
      --ok-soft: rgba(59, 122, 87, 0.12);
      --line: rgba(35, 34, 32, 0.12);
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Noto Sans TC', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      padding: 20px 16px 92px;
      position: relative;
    }

    /* 細膩紙張顆粒紋理 */
    body::before,
    .card::after,
    .item-card::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.045;
      z-index: 99;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .card, .item-card { position: relative; overflow: hidden; }
    .card::after, .item-card::after { position: absolute; opacity: 0.035; z-index: 0; }
    .card > *, .item-card > * { position: relative; z-index: 1; }

    .wrap { max-width: 580px; margin: 0 auto; }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em; }
    .tag-note {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--paper-2);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(35, 34, 32, 0.03);
    }
    .stat small { display: block; font-size: 0.74rem; color: var(--muted); }
    .stat strong { font-family: var(--mono); font-size: 1.05rem; }
    .stat strong.ok { color: var(--ok); }
    .stat strong.ac { color: var(--accent); }

    .promo {
      background: var(--accent-soft);
      border: 1px solid rgba(200, 109, 59, 0.25);
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 0.84rem;
      margin-bottom: 16px;
      color: #5a321c;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(35, 34, 32, 0.04);
    }
    .card h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 700; }

    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper-2);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 0.92rem;
    }
    textarea { min-height: 68px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      margin: 7px 0;
      cursor: pointer;
    }
    .check input { width: 16px; height: 16px; accent-color: var(--accent); }

    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 11px;
      border: none;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-main { background: var(--ink); color: var(--paper); }
    .btn-main:active { transform: scale(0.99); }

    .ai-card {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: var(--paper-2);
      border: 1px dashed rgba(35, 34, 32, 0.25);
      font-size: 0.85rem;
    }
    .ai-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip-btn {
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
    }
    .chip-btn.warm { background: var(--accent); color: #fff; border-color: var(--accent); }

    details.key-box { margin-top: 10px; font-size: 0.78rem; color: var(--muted); }
    details.key-box input { margin-top: 6px; padding: 7px 10px; font-family: var(--mono); font-size: 0.8rem; }

    /* 冷卻＆回本卡牌 */
    .item-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(35, 34, 32, 0.04);
    }
    .item-card.paid {
      border-color: rgba(59, 122, 87, 0.45);
      background: linear-gradient(160deg, var(--paper), rgba(59, 122, 87, 0.06));
    }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .item-title { font-weight: 700; font-size: 1rem; }
    .price-pill {
      font-family: var(--mono);
      font-size: 0.82rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--paper-2);
      white-space: nowrap;
    }
    .sub-txt { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
    .note-txt {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--paper-2);
      font-size: 0.82rem;
      color: #4a4741;
    }
    .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .links a {
      font-size: 0.75rem;
      text-decoration: none;
      color: var(--muted);
      background: var(--paper-2);
      padding: 4px 8px;
      border-radius: 7px;
    }
    .act-row { display: flex; gap: 8px; margin-top: 11px; }
    .act-row button {
      margin-top: 0;
      padding: 8px 10px;
      font-size: 0.8rem;
      border-radius: 9px;
      border: 1px solid var(--line);
      cursor: pointer;
      font-weight: 700;
    }
    .b-skip { flex: 1; background: var(--ok-soft); color: var(--ok); }
    .b-buy { flex: 1; background: var(--paper-2); color: var(--ink); }
    .b-del { background: transparent; color: var(--muted); }

    /* 墓碑＆真香卡片 */
    .tomb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tomb-card {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-top: 4px solid #8c867a;
      border-radius: 18px 18px 10px 10px;
      padding: 12px;
      text-align: center;
    }
    .tomb-card .emoji { font-size: 1.3rem; }
    .tomb-card .name { font-weight: 700; font-size: 0.9rem; margin: 4px 0 2px; }
    .tomb-card .saved { font-family: var(--mono); font-size: 0.78rem; color: var(--ok); }
    .tomb-card .date { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .hall-card {
      background: var(--paper-2);
      border: 1px solid rgba(200, 109, 59, 0.3);
      border-radius: 12px;
      padding: 11px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    canvas { width: 100%; border-radius: 14px; margin-top: 12px; display: none; border: 1px solid var(--line); }

    /* 底部簡約導覽 */
    .nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 548px;
      background: rgba(251, 249, 245, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      box-shadow: 0 8px 24px rgba(35, 34, 32, 0.08);
      z-index: 50;
    }
    .nav button {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 4px;
      border-radius: 12px;
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .nav button.active { background: var(--ink); color: var(--paper); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>先冷靜一下</h1>
    <span class="tag-note">冷卻室 × 回本所</span>
  </div>

  <div class="stats">
    <div class="stat">
      <small>忍住省下</small>
      <strong class="ok" id="savedTotal">$0</strong>
    </div>
    <div class="stat">
      <small>慾望墓碑</small>
      <strong class="ac" id="tombCount">0</strong>
    </div>
    <div class="stat">
      <small>真香回本</small>
      <strong id="hallCount">0</strong>
    </div>
  </div>

  <div class="promo" id="promoBanner">看看下一波折扣什麼時候到...</div>

  <!-- 1. 冷卻室 -->
  <div id="panel-cool" class="panel active">
    <div class="card">
      <h2>又想買什麼了？先關進來冷靜</h2>
      <label>想買啥</label>
      <input id="cName" placeholder="例如：某個一直滑到的周邊、耳機" />

      <div class="row-2">
        <div>
          <label>多少錢（NT$）</label>
          <input id="cPrice" type="number" min="1" placeholder="1500" />
        </div>
        <div>
          <label>關多久再說</label>
          <select id="cHours">
            <option value="24">24 小時</option>
            <option value="72" selected>3 天（72h）</option>
            <option value="168">7 天</option>
          </select>
        </div>
      </div>

      <label>現在狀態（有中就勾）</label>
      <label class="check"><input type="checkbox" id="qNight" /> 深夜／心情差／想靠花錢紓壓</label>
      <label class="check"><input type="checkbox" id="qDup" /> 家裡其實有類似的，只是想換口味</label>
      <label class="check"><input type="checkbox" id="qSocial" /> 看到限時／折扣／別人曬單被燒到</label>

      <label>自己寫寫看：你覺得非買不可的理由是？</label>
      <textarea id="cConfession" placeholder="隨便寫，例如：這波錯過不知道還要等多久、最近真的很累想買點開心的..."></textarea>

      <button class="btn btn-main" onclick="addCooling()">先丟進冷卻室＋生出 AI 拷問稿</button>

      <div id="aiBox" class="ai-card" style="display:none;">
        <div id="localTip"></div>
        <div class="ai-btns">
          <button class="chip-btn warm" onclick="copyPrompt()">複製拷問稿給 AI 吐槽</button>
          <a class="chip-btn" href="https://gemini.google.com/app" target="_blank" rel="noopener">開 Gemini ↗</a>
          <a class="chip-btn" href="https://chatgpt.com/" target="_blank" rel="noopener">開 ChatGPT ↗</a>
        </div>
        <details class="key-box">
          <summary>有 Gemini API Key 也可以直接在這裡問</summary>
          <input id="geminiKey" type="password" placeholder="貼上 API Key（只存這台裝置）" onchange="saveKey(this.value)" />
          <button class="chip-btn" style="margin-top:6px;" onclick="askGemini()">直接問 AI</button>
          <div id="aiReply" style="margin-top:8px; white-space:pre-wrap; color:var(--ink);"></div>
        </details>
      </div>
    </div>

    <div id="coolList"></div>
  </div>

  <!-- 2. 回本卡牌 -->
  <div id="panel-repay" class="panel">
    <div class="card">
      <h2>買了就來算回本沒</h2>
      <label>東西名稱</label>
      <input id="rName" placeholder="例如：小風扇、包包、鍵盤" />
      <div class="row-2">
        <div>
          <label>入手價（NT$）</label>
          <input id="rPrice" type="number" min="1" placeholder="1200" />
        </div>
        <div>
          <label>已經用幾次了</label>
          <input id="rUses" type="number" min="1" value="1" />
        </div>
      </div>
      <label>用一次低於幾元算回本？（NT$）</label>
      <input id="rTarget" type="number" min="1" value="30" />
      <button class="btn btn-main" onclick="addRepay()">加入回本卡牌</button>
    </div>

    <div id="repayList"></div>
  </div>

  <!-- 3. 墓碑＆真香 -->
  <div id="panel-grave" class="panel">
    <div class="card">
      <h2>🪦 慾望墓碑（忍住沒買的都在這）</h2>
      <div id="graveList" class="tomb-grid">
        <div class="sub-txt" style="grid-column:1/-1;">還沒立過碑，下次想手滑先忍住一筆看看。</div>
      </div>
    </div>

    <div class="card">
      <h2>✨ 真香殿堂（真的有在用的狠角色）</h2>
      <div id="hallList">
        <div class="sub-txt">還沒解鎖真香卡，去「算回本」幫東西按幾次使用紀錄吧。</div>
      </div>
    </div>
  </div>

  <!-- 4. 戰報圖 -->
  <div id="panel-report" class="panel">
    <div class="card">
      <h2>📸 存一張戰報圖</h2>
      <div class="sub-txt">把省下來的錢跟墓碑數變成圖片，想發限動或留著看都行。</div>
      <button class="btn btn-main" onclick="makeReport()">產生戰報圖</button>
      <canvas id="reportCanvas" width="720" height="1080"></canvas>
      <button class="btn chip-btn warm" id="dlBtn" style="display:none; margin-top:10px;" onclick="saveImg()">下載圖片</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="active" onclick="goTab('cool', this)">冷卻室</button>
  <button onclick="goTab('repay', this)">算回本</button>
  <button onclick="goTab('grave', this)">墓碑/真香</button>
  <button onclick="goTab('report', this)">戰報圖</button>
</nav>

<script>
const DB_KEY = 'chill_wallet_v3';
const KEY_STORE = 'chill_gemini_key_v1';
const db = loadDb();
let promptCache = '';

function initDb() {
  return { cooling: [], repay: [], grave: [], hall: [], savedTotal: 0 };
}
function loadDb() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    return raw ? { ...initDb(), ...JSON.parse(raw) } : initDb();
  } catch { return initDb(); }
}
function saveDb() {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
  render();
}
function saveKey(v) {
  localStorage.setItem(KEY_STORE, v.trim());
}

window.addEventListener('DOMContentLoaded', () => {
  const k = localStorage.getItem(KEY_STORE);
  if (k) document.getElementById('geminiKey').value = k;
  render();
});

function goTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextSale() {
  const now = new Date();
  const y = now.getFullYear();
  const list = [
    { name: '雙12', d: new Date(y, 11, 12) },
    { name: '聖誕/跨年檔期', d: new Date(y, 11, 25) },
    { name: '過年檔期', d: new Date(y + 1, 0, 25) },
    { name: '618', d: new Date(y + 1, 5, 18) },
    { name: '雙11', d: new Date(y + 1, 10, 11) },
    { name: '雙12', d: new Date(y + 1, 11, 12) }
  ];
  const today = new Date(y, now.getMonth(), now.getDate());
  for (const item of list) {
    const days = Math.ceil((item.d - today) / 86400000);
    if (days >= 0) return { name: item.name, days };
  }
  return { name: '下波折扣', days: 14 };
}

function painStr(price) {
  const chicken = (price / 90).toFixed(1);
  const drink = Math.round(price / 55);
  return `大概 ${chicken} 份雞排 或 ${drink} 杯飲料`;
}

function shopLinks(name) {
  const q = encodeURIComponent(name.trim());
  return `
    <div class="links">
      <a target="_blank" rel="noopener" href="https://shopee.tw/search?keyword=${q}">蝦皮搜一下</a>
      <a target="_blank" rel="noopener" href="https://m.momoshop.com.tw/search.momo?searchKeyword=${q}">Momo</a>
      <a target="_blank" rel="noopener" href="https://24h.pchome.com.tw/search/?q=${q}">PChome</a>
      <a target="_blank" rel="noopener" href="https://biggo.com.tw/s/${q}/">比價網</a>
    </div>
  `;
}

function addCooling() {
  const name = document.getElementById('cName').value.trim();
  const price = Number(document.getElementById('cPrice').value);
  let hours = Number(document.getElementById('cHours').value);
  const confession = document.getElementById('cConfession').value.trim();

  if (!name || !price || price <= 0) return alert('名字跟金額要先填喔');

  const reasons = [];
  let risk = 25;
  if (document.getElementById('qNight').checked) { risk += 25; reasons.push('深夜/情緒上來'); }
  if (document.getElementById('qDup').checked) { risk += 25; reasons.push('家裡有類似的'); }
  if (document.getElementById('qSocial').checked) { risk += 20; reasons.push('被推播或折扣燒到'); }
  risk = Math.min(99, risk);
  if (risk >= 70) hours = Math.max(hours, 72);

  const sale = nextSale();
  promptCache = `幫我用自然、有點嘴賤但不要說教的台灣口語吐槽一下我現在想買的東西，點出我可能腦波弱的地方，最後給一句要不要等特價或冷靜看看的建議：
- 想買：${name}（NT$ ${price}，${painStr(price)}）
- 狀態：${reasons.length ? reasons.join('、') : '沒特別勾'}
- 我自己寫的理由：「${confession || '沒寫，純粹想買'}」
- 距離 ${sale.name} 還有 ${sale.days} 天`;

  document.getElementById('aiBox').style.display = 'block';
  document.getElementById('localTip').innerHTML =
    `衝動指數 <b>${risk}%</b>，先關個 <b>${hours} 小時</b>再說。${painStr(price)}，離「${sale.name}」還有 <b>${sale.days} 天</b>。`;
  document.getElementById('aiReply').textContent = '';

  db.cooling.unshift({
    id: Date.now(),
    name,
    price,
    risk,
    confession,
    unlockAt: Date.now() + hours * 3600 * 1000
  });

  document.getElementById('cName').value = '';
  document.getElementById('cPrice').value = '';
  document.getElementById('cConfession').value = '';
  saveDb();
}

function copyPrompt() {
  if (!promptCache) return;
  navigator.clipboard.writeText(promptCache).then(() => {
    alert('拷問稿複製好了，直接去貼給 AI 看它怎麼酸你');
  }).catch(() => {
    prompt('自己複製這段去貼給 AI：', promptCache);
  });
}

async function askGemini() {
  const key = document.getElementById('geminiKey').value.trim();
  const out = document.getElementById('aiReply');
  if (!key) return alert('先貼上 API Key 啦');
  if (!promptCache) return alert('先建一筆想買的東西');

  out.textContent = 'AI 正在想怎麼吐槽你...';
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: promptCache }] }] })
    });
    const j = await r.json();
    out.textContent = j?.candidates?.[0]?.content?.parts?.[0]?.text || ('出錯了：' + (j?.error?.message || '金鑰可能有問題'));
  } catch (e) {
    out.textContent = '連不上：' + e.message;
  }
}

function actCooling(id, type) {
  const i = db.cooling.findIndex(x => x.id === id);
  if (i === -1) return;
  const item = db.cooling[i];
  db.cooling.splice(i, 1);

  if (type === 'skip') {
    db.savedTotal += item.price;
    db.grave.unshift({ ...item, date: new Date().toLocaleDateString('zh-TW') });
  } else if (type === 'buy') {
    db.repay.unshift({ id: Date.now(), name: item.name, price: item.price, uses: 1, target: 30 });
  }
  saveDb();
}

function addRepay() {
  const name = document.getElementById('rName').value.trim();
  const price = Number(document.getElementById('rPrice').value);
  const uses = Math.max(1, Number(document.getElementById('rUses').value) || 1);
  const target = Math.max(1, Number(document.getElementById('rTarget').value) || 30);
  if (!name || !price || price <= 0) return alert('東西名字跟入手價要填喔');

  db.repay.unshift({ id: Date.now(), name, price, uses, target });
  document.getElementById('rName').value = '';
  document.getElementById('rPrice').value = '';
  saveDb();
}

function addUse(id) {
  const item = db.repay.find(x => x.id === id);
  if (!item) return;
  item.uses += 1;
  const perUse = Math.round(item.price / item.uses);
  if (perUse <= item.target && !db.hall.some(h => h.id === item.id)) {
    db.hall.unshift({ ...item, perUse });
  }
  saveDb();
}

function delRepay(id) {
  db.repay = db.repay.filter(x => x.id !== id);
  saveDb();
}

function timeLeft(ms) {
  if (ms <= 0) return '時間到！可以決定了';
  const mins = Math.floor(ms / 60000);
  return `還剩 ${Math.floor(mins / 60)} 小時 ${mins % 60} 分`;
}

function render() {
  document.getElementById('savedTotal').textContent = '$' + db.savedTotal.toLocaleString();
  document.getElementById('tombCount').textContent = db.grave.length;
  document.getElementById('hallCount').textContent = db.hall.length;

  const sale = nextSale();
  document.getElementById('promoBanner').innerHTML =
    `下一波大概是「<b>${sale.name}</b>」，還有 <b>${sale.days} 天</b>。不是急著要用的，先撐一下搞不好更便宜。`;

  document.getElementById('coolList').innerHTML = db.cooling.map(item => `
    <div class="item-card">
      <div class="item-top">
        <div>
          <div class="item-title">${esc(item.name)}</div>
          <div class="sub-txt">${timeLeft(item.unlockAt - Date.now())} · ${painStr(item.price)}</div>
        </div>
        <span class="price-pill">$${item.price.toLocaleString()}</span>
      </div>
      ${item.confession ? `<div class="note-txt">「${esc(item.confession)}」</div>` : ''}
      ${shopLinks(item.name)}
      <div class="act-row">
        <button class="b-skip" onclick="actCooling(${item.id}, 'skip')">忍住了，立碑！</button>
        <button class="b-buy" onclick="actCooling(${item.id}, 'buy')">還是買了</button>
        <button class="b-del" onclick="actCooling(${item.id}, 'del')">刪掉</button>
      </div>
    </div>
  `).join('');

  document.getElementById('repayList').innerHTML = db.repay.map(item => {
    const perUse = Math.round(item.price / item.uses);
    const done = perUse <= item.target;
    return `
      <div class="item-card ${done ? 'paid' : ''}">
        <div class="item-top">
          <div>
            <div class="item-title">${esc(item.name)} ${done ? '✨' : ''}</div>
            <div class="sub-txt">用了 <b>${item.uses}</b> 次 · 每次約 <b>$${perUse}</b>（目標 ≤ $${item.target}）</div>
          </div>
          <span class="price-pill">$${item.price.toLocaleString()}</span>
        </div>
        <div class="act-row">
          <button class="b-skip" onclick="addUse(${item.id})">+1 次使用</button>
          <button class="b-del" onclick="delRepay(${item.id})">刪除</button>
        </div>
      </div>
    `;
  }).join('');

  const graveEl = document.getElementById('graveList');
  if (db.grave.length) {
    graveEl.innerHTML = db.grave.map(g => `
      <div class="tomb-card">
        <div class="emoji">🪦</div>
        <div class="name">${esc(g.name)}</div>
        <div class="saved">省下 $${g.price.toLocaleString()}</div>
        <div class="date">${g.date}</div>
      </div>
    `).join('');
  }

  const hallEl = document.getElementById('hallList');
  if (db.hall.length) {
    hallEl.innerHTML = db.hall.map(h => `
      <div class="hall-card">
        <div>
          <div style="font-weight:700;">${esc(h.name)}</div>
          <div class="sub-txt">累積用 ${h.uses} 次，真香</div>
        </div>
        <div style="font-family:var(--mono); font-weight:700; color:var(--accent);">$${h.perUse}/次</div>
      </div>
    `).join('');
  }
}

function makeReport() {
  const c = document.getElementById('reportCanvas');
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f4f1ea';
  ctx.fillRect(0, 0, c.width, c.height);

  ctx.strokeStyle = 'rgba(35,34,32,0.16)';
  ctx.lineWidth = 3;
  ctx.strokeRect(36, 36, c.width - 72, c.height - 72);

  ctx.fillStyle = '#78746c';
  ctx.font = '24px sans-serif';
  ctx.fillText('先冷靜一下｜冷卻室 × 回本所', 72, 110);

  ctx.fillStyle = '#232220';
  ctx.font = 'bold 46px sans-serif';
  ctx.fillText('這次算我忍得住', 72, 175);

  ctx.fillStyle = '#3b7a57';
  ctx.font = 'bold 82px monospace';
  ctx.fillText('NT$ ' + db.savedTotal.toLocaleString(), 72, 330);

  ctx.fillStyle = '#78746c';
  ctx.font = '24px sans-serif';
  ctx.fillText('累計守住沒亂花的錢', 72, 375);

  ctx.fillStyle = '#232220';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText(`🪦 慾望墓碑：${db.grave.length} 塊`, 72, 510);
  ctx.fillText(`✨ 真香回本：${db.hall.length} 件`, 72, 570);
  ctx.fillText(`🧊 還在冷靜：${db.cooling.length} 件`, 72, 630);

  ctx.fillStyle = '#5a321c';
  ctx.font = '25px sans-serif';
  ctx.fillText(db.savedTotal > 0 ? '錢包表示欣慰，繼續保持。' : '第一塊墓碑還在等誕生。', 72, 770);

  c.style.display = 'block';
  document.getElementById('dlBtn').style.display = 'inline-block';
}

function saveImg() {
  const c = document.getElementById('reportCanvas');
  const a = document.createElement('a');
  a.download = 'chill-wallet-report.png';
  a.href = c.toDataURL('image/png');
  a.click();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

setInterval(render, 30000);
</script>
</body>
</html>
